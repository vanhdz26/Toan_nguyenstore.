<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body { text-align:center; padding:40px; }
        .box {
            width:350px;
            margin:auto;
            padding:20px;
            background:#f5f5f5;
            border-radius:10px;
        }
        input { width:100%; padding:10px; margin:8px 0; }
        button { padding:10px; background:#088178; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>

<body>

<div class="box">
    <h2>Đăng ký</h2>

    <input id="reg_name" placeholder="Họ và tên" type="text">
    <input id="reg_phone" placeholder="Số điện thoại" type="text">
    <input id="reg_email" placeholder="Email" type="text">
    <input id="reg_pass" placeholder="Mật khẩu" type="password">
    <input id="reg_address" placeholder="Địa chỉ (không bắt buộc)" type="text">

    <button onclick="registerUserFinal()">Tạo tài khoản</button>

    <p>Đã có tài khoản? <a href="login-user.html">Đăng nhập</a></p>
</div>

<script src="user.js"></script>

</body>
</html>
