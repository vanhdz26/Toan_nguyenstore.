<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

    <!-- HEADER ADMIN -->
    <section id="header">
        <a href="admin-dashboard.html"><img src="img/logo.png" class="logo"></a>

        <div>
            <ul id="navbar">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-products.html">Sản phẩm</a></li>
                <li><a class="active" href="orders.html">Đơn hàng</a></li>

                <li id="userArea"></li>

                <li><a href="index.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </div>

        <div id="mobile">
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <div class="admin-wrapper">
        <div class="admin-title">
            <div>
                <h2>📦 Quản lý Đơn Hàng</h2>
                <span>Xem toàn bộ đơn hàng khách đã đặt</span>
            </div>
        </div>

        <table id="ordersTable" class="admin-table">
            <!-- core-orders.js sẽ tự render -->
        </table>

        <button class="btn-admin danger" onclick="clearAllOrders()">
            Xóa toàn bộ đơn hàng
        </button>
    </div>

    <!-- JS CORE -->
    <script src="js/core-auth.js"></script>
    <script src="js/core-products.js"></script>
    <script src="js/core-cart.js"></script>
    <script src="js/core-orders.js"></script>
    <script src="js/core-ui.js"></script>

    <script>
        // CHỈ ADMIN ĐƯỢC VÀO
        const user = getCurrentUser();
        if (!user || user.role !== "admin") {
            alert("Bạn không có quyền truy cập trang ADMIN!");
            window.location.href = "index.html";
        }

        // Navbar
        displayUserNavbar();

        // Render đơn hàng (core-orders.js làm)
        renderAdminOrders && renderAdminOrders(); // nếu có hàm
    </script>

</body>
</html>
