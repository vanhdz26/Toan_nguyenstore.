<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập khách hàng</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body { text-align:center; padding:40px; }
        .box {
            width:350px;
            margin:auto;
            padding:20px;
            background:#f5f5f5;
            border-radius:10px;
        }
        input { width:100%; padding:10px; margin:8px 0; }
        button { padding:10px; background:#088178; color:white; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>

<body>

<div class="box">
    <h2>Đăng nhập</h2>

    <input id="log_email" placeholder="Email" type="text">
    <input id="log_pass" placeholder="Mật khẩu" type="password">

    <button onclick="loginUserFinal()">Đăng nhập</button>

    <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
</div>

<script src="user.js"></script>

</body>
</html>
